# Company slide standard. The generator writes to it and deckcheck enforces it.
# Each key under `rules` is a deckcheck rule id. Removing a key disables that rule.
rules:
  max-fonts-per-slide:
    max: 3
  no-bullet-end-punctuation:
    chars: ".;,"
  slide-has-title:
    exempt_layouts: ["Title Slide", "Section Header", "End", "D. End", "Disclaimer", "D. Disclaimer", "Quote", "D. Quote"]
  title-max-chars:
    max: 150
  min-font-size:
    min_pt: 7
  no-placeholder-text:
    patterns: ["click to add", "lorem ipsum", "\\bTBD\\b", "\\bXX+\\b", "\\[insert", "\\?\\?\\?"]
  within-slide-bounds:
    tolerance_pt: 18
  source-on-data-slides:
    prefix: "Source"
